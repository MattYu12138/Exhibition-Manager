server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;
    # The HTML entry must never be cached: it is the manifest that maps routes
    # to fingerprinted JS chunks. Cached HTML plus a new deployment otherwise
    # leaves mobile Safari asking for a chunk from an earlier release.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        # Fingerprinted assets are immutable; only index.html changes per build.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        set $backend http://warehouse-backend:3003;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
